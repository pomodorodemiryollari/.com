<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demiryolu Pomodoro - Haritalı Sefer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #1a120b; /* Koyu ahşap/gizemli atmosfer */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- 1. EKRAN: BİLET GİŞESİ --- */
        .booth-card {
            background-color: #f5eedc;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 500px;
            border: 4px double #65451f;
            text-align: center;
        }

        .booth-header h2 { color: #432c10; margin-bottom: 5px; letter-spacing: 1px; }
        .booth-header p { font-style: italic; color: #765827; margin-bottom: 25px; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 0.9rem; font-weight: bold; color: #432c10; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #765827; background-color: #fffdf9; border-radius: 6px; font-size: 1rem; }
        
        .issue-btn {
            width: 100%; padding: 16px; background-color: #433520; color: #f5eedc;
            border: none; font-size: 1.1rem; font-weight: bold; border-radius: 6px;
            cursor: pointer; transition: all 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .issue-btn:hover { background-color: #765827; }

        /* --- 2. EKRAN: HARİTA MASASI (ANA PANEL) --- */
        .map-table-container {
            background-color: #eed6b2; /* Eskitme harita kağıdı rengi */
            border: 8px double #432c10;
            border-radius: 4px;
            padding: 25px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(67,44,16,0.2);
            color: #432c10;
        }

        .table-header {
            text-align: center;
            border-bottom: 2px dashed #65451f;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        /* 🗺️ COĞRAFİ HARİTA ALANI */
        .geo-map {
            position: relative;
            width: 100%;
            height: 380px; /* Geniş coğrafi alan */
            background-color: #e5cb9e;
            border: 2px solid #65451f;
            border-radius: 8px;
            overflow: hidden;
            /* Hafif topoğrafik harita dokusu efekti */
            background-image: radial-gradient(rgba(67,44,16,0.05) 15%, transparent 15%),
                              linear-gradient(45deg, rgba(67,44,16,0.02) 25%, transparent 25%);
            background-size: 20px 20px;
        }

        /* Kıvrımlı Demiryolu Ağı (Şehirleri bağlayan dekoratif çizgiler) */
        .map-vector {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* Harita Üzerindeki Şehir İstasyonları (Gerçek harita koordinatları gibi serpiştirildi) */
        .geo-station {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        .station-pin {
            width: 24px;
            height: 24px;
            background-color: #fffdf9;
            border: 4px solid #65451f;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            font-weight: bold;
            transition: all 0.4s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        /* Ziyaret edilen şehir parlasın */
        .geo-station.visited .station-pin {
            background-color: #2d5a27;
            border-color: #1e3f1a;
            color: white;
            box-shadow: 0 0 15px #2d5a27;
        }

        .geo-label {
            margin-top: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            background-color: #432c10;
            color: #f5eedc;
            padding: 2px 8px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
        }

        /* 🚂 HARİTADA SERBESTÇE SEYAHAT EDEN LOKOMOTİF */
        .map-locomotive {
            position: absolute;
            font-size: 2.5rem;
            transform: translate(-50%, -70%);
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1); /* Şehirler arası pürüzsüz süzülme */
            z-index: 10;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.3));
        }

        .locomotive-chugging {
            animation: chugAnimation 0.3s infinite alternate ease-in-out;
        }

        @keyframes chugAnimation {
            from { transform: translate(-50%, -70%) translateY(0) scaleX(1); }
            to { transform: translate(-50%, -70%) translateY(-5px) scaleX(1.03); }
        }

        /* ⏱️ KUMANDA MASASI VE SAYAÇ */
        .dashboard {
            margin-top: 25px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border-top: 3px double #65451f;
            padding-top: 20px;
            align-items: center;
        }

        .panel-clock {
            text-align: center;
        }

        .time-text {
            font-family: 'Courier New', Courier, monospace;
            font-size: 4.5rem;
            font-weight: bold;
            color: #2b1f1d;
            background: rgba(0,0,0,0.05);
            padding: 5px 15px;
            border-radius: 8px;
            display: inline-block;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .panel-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-btn {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        #btn-trigger { background-color: #2d5a27; }
        #btn-trigger:hover { background-color: #3c7a35; }
        #btn-abort { background-color: #8c2525; }
        #btn-abort:hover { background-color: #b33636; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="view-booth" class="booth-card">
        <div class="booth-header">
            <h2>HİCAZ-EKSPRES GİŞESİ</h2>
            <p>Harita Üzerinde Odaklanma Yolculuğu</p>
        </div>

        <form onsubmit="event.preventDefault(); buyTicketAndLaunch();">
            <div class="form-group">
                <label>Makinist Adı Soyadı:</label>
                <input type="text" id="pass-name" placeholder="Adınızı yazın..." required>
            </div>
            <div class="form-group">
                <label>Rota Seçimi:</label>
                <select disabled>
                    <option>İstanbul → Eskişehir → Kütahya → Balıkesir → İzmir</option>
                </select>
            </div>
            <button type="submit" class="issue-btn">🎫 Bileti Onayla ve Haritayı Aç</button>
        </form>
    </div>

    <div id="view-map-table" class="map-table-container hidden">
        <div class="table-header">
            <h2 id="lbl-status">Tren İstanbul Garı'nda Bekliyor</h2>
            <p id="lbl-meta">Makinist: -</p>
        </div>

        <div class="geo-map">
            <svg class="map-vector">
                <path d="M 180,60 L 450,130 L 400,240 L 220,230 L 140,320" 
                      fill="none" stroke="#65451f" stroke-width="4" stroke-dasharray="8,6" />
            </svg>

            <div id="locomotive" class="map-locomotive" style="left: 180px; top: 60px;">🚂</div>

            <div class="geo-station visited" style="left: 180px; top: 60px;" id="st-0">
                <div class="station-pin">İST</div>
                <div class="geo-label">İstanbul</div>
            </div>

            <div class="geo-station" style="left: 450px; top: 130px;" id="st-1">
                <div class="station-pin">ESK</div>
                <div class="geo-label">Eskişehir</div>
            </div>

            <div class="geo-station" style="left: 400px; top: 240px;" id="st-2">
                <div class="station-pin">KÜT</div>
                <div class="geo-label">Kütahya</div>
            </div>

            <div class="geo-station" style="left: 220px; top: 230px;" id="st-3">
                <div class="station-pin">BAL</div>
                <div class="geo-label">Balıkesir</div>
            </div>

            <div class="geo-station" style="left: 140px; top: 320px;" id="st-4">
                <div class="station-pin">İZM</div>
                <div class="geo-label">İzmir</div>
            </div>
        </div>

        <div class="dashboard">
            <div class="panel-clock">
                <div id="clock-txt" class="time-text">25:00</div>
            </div>
            <div class="panel-controls">
                <button id="btn-trigger" class="control-btn" onclick="toggleEngine()">Kazanları Ateşle (Başlat)</button>
                <button id="btn-abort" class="control-btn" onclick="abortTrip()">Seferi İptal Et</button>
            </div>
        </div>
    </div>

    <audio id="sound-whistle" src="https://actions.google.com/sounds/v1/transportation/train_whistle.ogg" preload="auto"></audio>

    <script>
        let timeLeft = 25 * 60; 
        let engineLoop = null;
        let breakMode = false;
        let activeCityIndex = 0; 

        // Şehirlerin Harita Üzerindeki Tam Pixel Koordinatları (X , Y)
        const cityCoordinates =
